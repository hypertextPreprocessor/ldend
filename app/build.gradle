/*
 * This file was generated by the Gradle 'init' task.
 */

plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'buildlogic.java-application-conventions'
}
java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(25)
  }
}
repositories {
  mavenCentral()
}
dependencies {
    implementation 'org.glassfish.expressly:expressly:6.0.0'
    implementation 'org.hibernate.validator:hibernate-validator:9.1.3.Final'
    implementation 'org.hibernate.reactive:hibernate-reactive-core:4.5.2.Final'
    implementation 'io.vertx:vertx-pg-client:5.1.5'
    compileOnly 'org.hibernate.orm:hibernate-jpamodelgen:8.0.0.Beta1'

    implementation 'io.jsonwebtoken:jjwt:0.13.0'
    //implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-session-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'org.postgresql:r2dbc-postgresql'
    //testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-r2dbc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-session-data-redis-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-thymeleaf-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webflux-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'org.apache.commons:commons-text'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation project(':utilities')
}
tasks.named('test') {
  useJUnitPlatform()
}
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << "-parameters"
}
application {
    // Define the main class for the application.
    mainClass = 'org.example.app.App'
}
